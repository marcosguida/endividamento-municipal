[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-fiscal-municipal"
version = "1.0.0"
description = "Radar Fiscal Municipal: análise de dados do endividamento municipal e da dependência do FPM"
readme = "README.md"
authors = [{ name = "Marcos Ribeiro Guida" }]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["jupyter"]

[tool.setuptools]
packages = ["endividamento"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:matplotlib.*"]
