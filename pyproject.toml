[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "endividamento-municipal"
version = "1.0.0"
description = "API e pipeline de análise do endividamento municipal e da dependência do FPM"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
notebooks = ["jupyter", "openpyxl", "numpy"]

[tool.setuptools]
packages = ["endividamento"]

[tool.pytest.ini_options]
testpaths = ["tests"]
